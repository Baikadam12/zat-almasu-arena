<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2f6b">
<title>Көмірсу · 3D Ұшақ шабуылы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2f6b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#0f172a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 52%,rgba(4,18,48,.42) 100%)}
:root{--accent:#4f6ef7;--accent2:#9b5cf6;--good:#16b981;--bad:#ef4444}
.lbl{font-size:9.5px;font-weight:900;letter-spacing:1.1px;color:#7b879d;text-transform:uppercase}
.big{font-size:22px;font-weight:900;line-height:1;letter-spacing:-.3px}
.card{background:rgba(255,255,255,.94);border-radius:20px;
  box-shadow:0 18px 40px -18px rgba(6,20,52,.55),inset 0 0 0 1px rgba(255,255,255,.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 10px 0}
#hud.hide{display:none}
.toprow{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.pod{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:18px}
#hLives{display:flex;gap:4px}
#hLives .h{width:19px;height:19px}
#hLives .h.off{opacity:.2;filter:grayscale(1)}
#hLives.break .h:not(.off){animation:brk .6s ease}
@keyframes brk{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px) rotate(-7deg)}
  50%{transform:translate(2px,-1px) rotate(7deg)}75%{transform:translate(-1px,1px)}}
.stat{min-width:54px;flex-direction:column;align-items:center;gap:3px}
#hScore.bump .big{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{50%{transform:scale(1.3);color:var(--accent)}}
#hStreak{position:absolute;left:10px;top:calc(62px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:16px;font-weight:900;font-size:14px}
#hStreak.hot{color:#b45309;box-shadow:0 0 0 2px rgba(245,158,11,.6),0 14px 26px -10px rgba(245,158,11,.6)}

/* дыбыс түймесі */
#btnSnd{position:fixed;right:10px;top:calc(64px + env(safe-area-inset-top));z-index:11;width:46px;height:46px;
  border:0;border-radius:16px;display:grid;place-items:center;cursor:pointer;color:#fff;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;background:rgba(10,25,60,.46);
  box-shadow:0 14px 26px -14px rgba(6,20,52,.9),inset 0 0 0 1px rgba(255,255,255,.32)}
#btnSnd:active{transform:scale(.93)}
#btnSnd svg{width:23px;height:23px}
#btnSnd .iOff{display:none}
#btnSnd.muted .iOn{display:none}
#btnSnd.muted .iOff{display:block}
#btnSnd.hide{display:none}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 12px calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:9px;justify-content:center;pointer-events:none}
#bar.hide{display:none}
#bar button{position:relative;flex:1 1 0;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;touch-action:manipulation;
  border:0;border-radius:17px;padding:9px 4px 7px;font:inherit;font-weight:900;font-size:10.5px;letter-spacing:.3px;
  color:#33415f;background:rgba(255,255,255,.94);box-shadow:0 14px 28px -12px rgba(6,20,52,.55),inset 0 0 0 1px rgba(255,255,255,.7);
  cursor:pointer;transition:transform .12s,opacity .2s}
#bar button:active{transform:scale(.93)}
#bar button[disabled]{opacity:.4}
#bar button .n{position:absolute;top:-4px;right:8px;background:var(--accent);color:#fff;font-size:9px;
  border-radius:9px;padding:1px 5px;font-weight:900}
#bar button svg{width:22px;height:22px}

/* screens */
#scr{position:fixed;inset:0;display:none;place-items:center;padding:16px;z-index:9;
  background:linear-gradient(180deg,rgba(6,22,58,.6),rgba(6,22,58,.35))}
#scr.show{display:grid}
.panel{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:20px 18px 18px;
  border-radius:26px;text-align:center;animation:popIn .36s cubic-bezier(.2,1.4,.35,1) both}
@keyframes popIn{from{opacity:0;translate:0 16px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
h1{margin:2px 0 5px;font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1.08}
h1 span{background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 14px;font-size:12.5px;font-weight:700;color:#6b7691;line-height:1.45}
.field{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:16px;background:#fff;
  box-shadow:inset 0 0 0 2px rgba(79,110,247,.22);margin-bottom:12px}
.field input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-weight:800;font-size:15px;color:#0f172a;background:none}
.field svg{flex:none;width:20px;height:20px}
.field .unit{flex:none;font-size:12px;font-weight:900;color:#6b7691}
.field input[type=number]{flex:none;width:74px;text-align:center;font-size:17px;-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field .stp{flex:none;width:36px;height:36px;border:0;border-radius:12px;background:rgba(79,110,247,.14);
  color:var(--accent);font:inherit;font-weight:900;font-size:20px;line-height:1;display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;padding:0}
.field .stp:active{transform:scale(.92)}
.seg{display:flex;gap:5px;padding:5px;border-radius:16px;background:rgba(16,20,24,.055);margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:900;font-size:11px;color:#6b7691;
  padding:9px 3px;border-radius:12px;cursor:pointer;transition:.18s}
.seg button.on{background:#fff;color:#243b6b;box-shadow:0 8px 18px -8px rgba(6,20,52,.5)}
.cta{width:100%;border:0;border-radius:18px;padding:15px 12px;font:inherit;font-weight:900;font-size:16.5px;color:#fff;
  letter-spacing:.3px;cursor:pointer;background:linear-gradient(96deg,var(--accent),var(--accent2));
  box-shadow:0 18px 34px -14px rgba(79,110,247,.85);transition:transform .12s}
.cta:active{transform:scale(.97)}
.ghost{width:100%;border:0;border-radius:16px;padding:11px;margin-top:9px;font:inherit;font-weight:900;font-size:13px;
  color:#3d4c6b;background:rgba(79,110,247,.1);cursor:pointer}
.rows{display:flex;gap:8px;margin-bottom:13px}
.rows .card{flex:1;padding:10px 6px;border-radius:16px}
.rows .big{font-size:19px}
.note{font-size:11px;font-weight:700;color:#8b95ab;margin-top:11px;line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
  background:rgba(79,110,247,.11);color:#33488f;font-size:10.5px;font-weight:900;letter-spacing:.4px;margin-bottom:10px}

/* question sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;display:none;padding:0 10px calc(98px + env(safe-area-inset-bottom));z-index:6;pointer-events:none}
#sheet.show{display:block}
.qcard{pointer-events:auto;display:flex;flex-direction:column;
  max-height:calc(100dvh - 122px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  border-radius:24px;overflow:hidden;animation:slideUp .32s cubic-bezier(.2,1.1,.3,1) both;
  box-shadow:0 -18px 52px -14px rgba(6,20,52,.72),0 0 0 1px rgba(255,255,255,.5)}
@keyframes slideUp{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.qhead{flex:none;display:flex;align-items:center;gap:10px;padding:12px 13px;background:linear-gradient(100deg,#3f5ce0,#8b4fe8)}
.qhead .badge{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:0 0 auto}
.qhead .badge svg{width:32px;height:32px}
.qhead .who{flex:1;min-width:0;text-align:left}
.qhead .who b{display:block;font-size:9px;font-weight:900;letter-spacing:1.3px;color:rgba(255,255,255,.72)}
.qhead .who span{display:block;font-size:12.5px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(255,255,255,.16);border-radius:10px;padding:3px 9px;margin-top:3px}
#ring{width:46px;height:46px;flex:0 0 auto;position:relative}
#ring svg{transform:rotate(-90deg);width:46px;height:46px}
#ring circle{fill:none;stroke-width:5;stroke-linecap:round}
#ring .bg{stroke:rgba(255,255,255,.26)}
#ring .fg{stroke:#fff;transition:stroke .3s}
#ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
#ring.low .fg{stroke:#ffd166}
#ring.low b{animation:tick .5s infinite;color:#ffd166}
@keyframes tick{50%{transform:scale(1.18)}}
.qbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:rgba(255,255,255,.97);padding:14px 13px 13px;touch-action:manipulation}
#qText{font-size:17px;font-weight:900;line-height:1.28;letter-spacing:-.2px;margin:0 0 10px}
#qMeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
#qMeta .mpill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;font-size:10.5px;
  font-weight:900;background:rgba(79,110,247,.1);color:#33488f}
#qMeta .mpill.own{background:rgba(155,92,246,.13);color:#6b34b8}
#opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:12px;text-align:left;font:inherit;
  font-weight:800;font-size:14.5px;line-height:1.25;color:#1e2740;background:#f6f8fc;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(79,110,247,.18);
  box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06);transition:transform .12s,background .2s,box-shadow .2s}
.opt>*{pointer-events:none}
.opt:active{transform:scale(.985)}
.opt .k{width:26px;height:26px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:900;background:rgba(79,110,247,.13);color:var(--accent)}
.opt.right{background:rgba(22,185,129,.15);box-shadow:inset 0 0 0 2px var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:rgba(239,68,68,.13);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.3}
.qfoot{text-align:center;font-size:9.5px;font-weight:900;letter-spacing:1px;color:#9aa5bb;padding:9px 0 2px}

/* fx overlays */
#verdict{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));translate:-50% 0;z-index:8;
  padding:11px 20px;border-radius:99px;font-weight:900;font-size:17px;color:#fff;background:#0b1017;
  box-shadow:0 20px 40px -14px rgba(0,0,0,.7);opacity:0;pointer-events:none}
#verdict.show{animation:vIn .8s cubic-bezier(.2,1.4,.35,1) forwards}
@keyframes vIn{0%{opacity:0;scale:.7}16%{opacity:1;scale:1}76%{opacity:1;scale:1}100%{opacity:0;scale:.94}}
#verdict.ok{background:linear-gradient(96deg,#0f9e6e,#16b981)}
#verdict.bad{background:linear-gradient(96deg,#c92a2a,#ef4444)}
#banner{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;z-index:7;opacity:0}
#banner.show{animation:bIn 1.8s ease forwards}
@keyframes bIn{0%{opacity:0;scale:.7}12%{opacity:1;scale:1}74%{opacity:1;scale:1}100%{opacity:0;scale:1.12}}
#banner small{display:block;font-size:11px;font-weight:900;letter-spacing:5px;color:rgba(255,255,255,.86);
  text-shadow:0 3px 12px rgba(0,20,60,.6)}
#banner b{display:block;font-size:min(15vw,58px);font-weight:900;letter-spacing:-1.5px;color:#fff;line-height:1;
  margin:5px 0;text-shadow:0 8px 26px rgba(0,20,60,.55)}
#banner i{display:block;font-style:normal;font-size:13px;font-weight:900;color:#ffe08a;text-shadow:0 3px 12px rgba(0,0,0,.5)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
#hit{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 90px 26px rgba(239,68,68,.72)}
#hit.go{animation:hitA .55s ease-out}
@keyframes hitA{0%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));translate:-50% 0;z-index:9;
  padding:9px 15px;border-radius:14px;background:rgba(11,16,23,.9);color:#fff;font-size:12px;font-weight:900;
  opacity:0;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{animation:tIn 2.2s ease forwards}
@keyframes tIn{0%{opacity:0;translate:-50% 10px}12%,80%{opacity:1;translate:-50% 0}100%{opacity:0;translate:-50% 6px}}

/* editor */
.ed{display:flex;flex-direction:column;gap:8px;text-align:left}
.ed label{font-size:10px;font-weight:900;letter-spacing:.8px;color:#7b879d;text-transform:uppercase;margin-top:4px}
.ed input{width:100%;border:0;border-radius:13px;padding:11px 12px;font:inherit;font-weight:800;font-size:14px;
  background:#f6f8fc;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.07);outline:0;color:#1e2740}
.ed input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.ed .opt{padding:9px 11px;font-size:13.5px}
.ed .opt.pick{background:rgba(22,185,129,.14);box-shadow:inset 0 0 0 2px var(--good)}
.ed .opt.pick .k{background:var(--good);color:#fff}
.list{max-height:42dvh;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:10px;text-align:left}
.list .it{padding:10px 12px;border-radius:14px;background:#f6f8fc;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06)}
.list .it b{display:block;font-size:13px;font-weight:900;color:#1e2740;line-height:1.3}
.list .it span{display:block;font-size:11px;font-weight:700;color:#7b879d;margin-top:2px}
.list .it{position:relative;padding-right:78px}
.list .it.on{background:rgba(79,110,247,.09);box-shadow:inset 0 0 0 2px var(--accent)}
.list .it .ed2{position:absolute;right:41px;top:50%;translate:0 -50%;height:27px;padding:0 8px;border:0;border-radius:10px;
  background:rgba(79,110,247,.14);color:#2f4bd8;font:inherit;font-weight:900;font-size:10px;cursor:pointer}
.list .it .del{position:absolute;right:8px;top:50%;translate:0 -50%;width:27px;height:27px;border:0;border-radius:10px;
  background:rgba(239,68,68,.12);color:#b4232b;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer}
.list .it .del.arm{background:#ef4444;color:#fff;width:auto;padding:0 8px;font-size:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 9px;margin:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:0;border-radius:99px;padding:9px 13px;font:inherit;font-weight:900;font-size:11.5px;
  color:#41506e;background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.08);cursor:pointer;
  white-space:nowrap;transition:.16s}
.chips button b{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(16,20,24,.08);font-size:10px}
.chips button.on{background:linear-gradient(180deg,#5b7bff,#3f6ef7);color:#fff;box-shadow:0 12px 22px -12px rgba(63,110,247,.95)}
.chips button.on b{background:rgba(255,255,255,.24)}
.hint{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;margin:0 0 9px;text-align:left;
  box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06);font-size:11px;font-weight:700;color:#6b7691}
.hint b{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#2f4bd8;margin-bottom:4px}
.hint pre{margin:0;padding:8px 9px;border-radius:10px;background:#101a2e;color:#cfe0ff;font-size:10.5px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:120px}
textarea.ta{min-height:150px;resize:vertical;line-height:1.45;font-weight:700!important;font-size:13px!important}
.orow{display:flex;align-items:center;gap:7px}
.orow .tick{width:36px;height:38px;flex:0 0 auto;border:0;border-radius:12px;background:#eef2fa;color:#98a2b8;
  font:inherit;font-weight:900;font-size:12px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.07);transition:.16s}
.orow .tick.on{background:var(--good);color:#fff;box-shadow:0 10px 20px -10px rgba(22,185,129,.85)}
.orow .tick svg{width:17px;height:17px;display:block;margin:auto}
.orow .inp{flex:1;min-width:0}

/* онлайн жарыс */
.conn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.2px}
.conn::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.conn.ok{background:rgba(22,185,129,.15);color:#0d9160}
.conn.wait{background:rgba(245,158,11,.16);color:#9a5c0e;animation:pulse 1.3s ease-in-out infinite}
.conn.bad{background:rgba(239,68,68,.13);color:#b4232b}
@keyframes pulse{50%{opacity:.5}}
.rc{display:flex;gap:6px;justify-content:center;margin:0 0 4px}
.rc i{width:44px;height:52px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:23px;
  color:#fff;background:linear-gradient(180deg,#5b7bff,#3f6ef7);box-shadow:0 14px 24px -12px rgba(63,110,247,.9);
  opacity:0;transform:translateY(-16px) scale(.8);animation:rcIn .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes rcIn{to{opacity:1;transform:none}}
.rc.tip{text-align:center;font-size:10.5px;font-weight:900;letter-spacing:.4px;color:#8b95ab;margin:0 0 11px}
.lb{display:flex;flex-direction:column;gap:6px;margin:0 0 11px;text-align:left}
.lb .pl{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:14px;background:#f6f8fc;
  box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06);font-weight:800;font-size:13px;color:#1e2740;
  opacity:0;animation:fadeUp .42s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lb .pl .av{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.lb .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pl .sc{margin-left:auto;font-weight:900;color:var(--accent);font-size:12.5px;flex:0 0 auto}
.lb .pl.me{box-shadow:inset 0 0 0 2px var(--accent)}
.lb .pl.gone{opacity:.45}
.lb .pl .ho{font-size:8.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#9a5c0e;
  background:rgba(245,158,11,.18);padding:2px 6px;border-radius:99px;flex:0 0 auto}
.seg{display:flex;gap:6px;margin:0 0 10px}
.seg button{flex:1;border:0;border-radius:12px;padding:9px 5px;font:inherit;font-weight:900;font-size:11.5px;color:#54607a;
  background:#fff;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.07);cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(180deg,#5b7bff,#3f6ef7);color:#fff;box-shadow:0 12px 22px -12px rgba(63,110,247,.9)}
.seg button:disabled{opacity:.4}
.code{display:flex;gap:7px;justify-content:center;margin:0 0 11px}
.code input{width:52px;height:58px;text-align:center;font-size:25px;font-weight:900;border:0;border-radius:14px;
  background:#fff;box-shadow:inset 0 0 0 2px rgba(16,20,24,.09);outline:0;color:#1e2740;text-transform:uppercase;font-family:inherit}
.code input:focus{box-shadow:inset 0 0 0 2.5px var(--accent)}
.code input.err{animation:shk .34s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

#onlHud{position:fixed;right:10px;top:calc(112px + env(safe-area-inset-top));z-index:5;display:none;flex-direction:column;gap:4px;
  width:158px;padding:9px 10px;border-radius:16px;background:rgba(9,22,48,.64);color:#e8f1ff;pointer-events:none;
  box-shadow:0 18px 32px -20px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.16);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#onlHud.show{display:flex}
#onlHud b{display:block;font-size:8.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#9fb4d8;margin-bottom:2px}
#onlHud .r{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;line-height:1.4}
#onlHud .r i{font-style:normal;flex:0 0 13px;color:#9fb4d8;font-weight:900}
#onlHud .r u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px}
#onlHud .r s{margin-left:auto;text-decoration:none;font-weight:900;color:#ffd36b}
#onlHud .r.me u{color:#fff}
#onlHud .r.done i{color:#16b981}

/* подиум */
#podium{position:fixed;inset:0;z-index:13;display:none;overflow-y:auto;overflow-x:hidden;
  background:radial-gradient(130% 88% at 50% 0%,rgba(20,42,88,.82),rgba(5,12,28,.94));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#podium.show{display:block}
#podium.fade{animation:pdOut .38s ease forwards}
@keyframes pdOut{to{opacity:0}}
.pd-rays{position:absolute;top:-140px;left:50%;width:660px;height:660px;margin-left:-330px;pointer-events:none;
  background:repeating-conic-gradient(rgba(245,158,11,.22) 0deg 8deg,transparent 8deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);
  animation:raysIn 1.1s ease .2s both,spin 36s linear infinite}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pd-in{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:calc(34px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.pd-cup{width:88px;height:88px;opacity:0;animation:cupDrop .95s cubic-bezier(.2,1.5,.35,1) .1s forwards}
.pd-cup svg{width:88px;height:88px;filter:drop-shadow(0 16px 26px rgba(245,158,11,.5))}
@keyframes cupDrop{0%{opacity:0;transform:translateY(-96px) scale(.5) rotate(-12deg)}
  68%{opacity:1;transform:translateY(8px) scale(1.07) rotate(3deg)}100%{opacity:1;transform:none}}
.pd-kicker{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#a9bde0;
  margin-top:10px;opacity:0;animation:fadeUp .5s ease .8s forwards}
.pd-winner{font-size:min(11vw,38px);font-weight:900;letter-spacing:-1px;line-height:1.14;margin:4px 0 2px;min-height:44px;
  color:#fff;word-break:break-word;text-shadow:0 10px 26px rgba(0,0,0,.5)}
.pd-winner .ltr{display:inline-block;opacity:0;transform:translateY(16px) scale(.7);
  animation:ltrIn .38s cubic-bezier(.2,1.6,.4,1) forwards;
  background:linear-gradient(180deg,#fff8e1,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes ltrIn{to{opacity:1;transform:none}}
.pd-sub{font-size:12px;font-weight:900;color:#c6d6f5;opacity:0;animation:fadeUp .5s ease 1.05s forwards}
.pd-pods{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:26px 0 4px}
.pod{width:92px;display:flex;flex-direction:column;align-items:center;opacity:0;animation:podRise .72s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes podRise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.pod .crn{width:34px;height:34px;margin-bottom:-11px;z-index:3;opacity:0;
  animation:crownDrop .8s cubic-bezier(.2,1.6,.4,1) 1.65s both;filter:drop-shadow(0 8px 14px rgba(245,158,11,.5))}
@keyframes crownDrop{0%{opacity:0;transform:translateY(-54px) rotate(-22deg) scale(.6)}100%{opacity:1;transform:none}}
.pod .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;
  border:3px solid rgba(255,255,255,.92);box-shadow:0 12px 24px -12px rgba(0,0,0,.7);position:relative;z-index:2}
.pod .nm{font-size:12px;font-weight:900;margin-top:7px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.pod .pt{font-size:10.5px;font-weight:900;color:#a9bde0}
.pod .bs{width:100%;border-radius:14px 14px 0 0;margin-top:9px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.pod .bs em{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-style:normal;font-size:17px;font-weight:900;color:rgba(20,26,40,.72)}
.pod.g .bs{height:132px;background:linear-gradient(180deg,#fde68a,#f0a416)}
.pod.s .bs{height:96px;background:linear-gradient(180deg,#eef2f7,#9aa9bd)}
.pod.b .bs{height:70px;background:linear-gradient(180deg,#fdba74,#c2701e)}
.pd-rows{width:100%;max-width:330px;margin-top:14px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:14px;text-align:left;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  font-size:13px;font-weight:900;color:#eaf2ff;opacity:0;animation:fadeUp .45s ease forwards}
.prow .pi{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;color:#fff;font-weight:900}
.prow .pu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pv{margin-left:auto;color:#ffd36b}
.pd-btns{width:100%;max-width:330px;margin-top:16px}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:14;
  animation:cfFall linear forwards}
@keyframes cfFall{to{transform:translateY(108vh) rotate(540deg);opacity:.15}}

/* floating 3D labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.plab{position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;display:none;
  align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:rgba(9,22,48,.66);box-shadow:0 12px 24px -14px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.18);

.plab.show{display:flex}
.plab span{font-size:11px;font-weight:900;letter-spacing:.3px;color:#fff}
.plab b{display:none;font-size:9px;font-weight:900;letter-spacing:1px;color:#ffd166}
.plab.boss b{display:block}
.plab.boss{background:rgba(96,54,7,.75);box-shadow:0 12px 26px -12px rgba(0,0,0,.8),inset 0 0 0 1.4px rgba(255,209,102,.75)}
.plab.near{background:rgba(79,110,247,.86)}
.plab.near.boss{background:rgba(180,83,9,.88)}

#nogl{position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:20;background:#0b2f6b}
#nogl.show{display:grid}
#spin{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:15;text-align:center;color:#fff}
#spin i{display:block;width:38px;height:38px;margin:0 auto 10px;border-radius:50%;
  border:4px solid rgba(255,255,255,.28);border-top-color:#fff;animation:sp .8s linear infinite;font-style:normal}
@keyframes sp{to{rotate:360deg}}
#spin b{font-size:11px;font-weight:900;letter-spacing:1.6px;opacity:.85}
#spin.gone{display:none}
</style>

<script src="./three.min.js"

<script>
(function(){'use strict';
/* ================= utils ================= */
var $=function(i){return document.getElementById(i)};
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[(Math.random()*a.length)|0]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function hash2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
var T=performance.now();

/* ================= questions ================= */
var QUIZ_POOL=[
 {c:"Көмірсу",q:"Көмірсулардың жалпы формуласы қандай?",o:["Cn(H2O)m","CnH2n","C2H5OH","R–COOH"],a:0,e:"Көмірсулар көміртек, сутек және оттектен тұрады, жалпы формуласы — Cn(H2O)m."},
 {c:"Мономер",q:"Көмірсулардың негізгі құрылыс бірлігі (мономері) не?",o:["Глюкоза","Аминқышқыл","Глицерин","Нуклеотид"],a:0,e:"Көмірсулардың мономері — моносахарид, көбінесе глюкоза. Аминқышқыл — белоктің, нуклеотид — нуклеин қышқылының мономері."},
 {c:"Моносахарид",q:"Төмендегілердің қайсысы моносахарид?",o:["Глюкоза","Сахароза","Крахмал","Целлюлоза"],a:0,e:"Глюкоза — бір молекуладан тұратын моносахарид. Сахароза — дисахарид, крахмал мен целлюлоза — полисахаридтер."},
 {c:"Дисахарид",q:"Қайсысы дисахаридке жатады?",o:["Сахароза","Глюкоза","Гликоген","Рибоза"],a:0,e:"Сахароза екі моносахаридтен (глюкоза + фруктоза) құралады, сондықтан дисахарид."},
 {c:"Полисахарид",q:"Қайсысы полисахаридке жатады?",o:["Крахмал","Фруктоза","Лактоза","Мальтоза"],a:0,e:"Крахмал — көптеген глюкоза қалдықтарынан тұратын полисахарид; фруктоза — моносахарид, лактоза мен мальтоза — дисахаридтер."},
 {c:"Өсімдік қоры",q:"Өсімдіктерде қорға жиналатын көмірсу қандай?",o:["Крахмал","Гликоген","Хитин","Целлюлоза"],a:0,e:"Өсімдіктер глюкозаны крахмал түрінде сақтайды. Гликоген — жануарлардың қоры, целлюлоза — жасуша қабырғасының құрылымдық заты."},
 {c:"Адам қоры",q:"Адам мен жануарлардағы қор көмірсуы не?",o:["Гликоген","Крахмал","Целлюлоза","Сахароза"],a:0,e:"Бауыр мен бұлшықетте глюкоза гликоген түрінде жиналады және қажет кезде қайта глюкозаға айналады."},
 {c:"Энергия",q:"1 грамм көмірсу толық ыдырағанда қанша энергия бөлінеді?",o:["17,6 кДж","4,1 кДж","38,9 кДж","9,3 кДж"],a:0,e:"1 г көмірсу мен 1 г белок ыдырағанда шамамен 17,6 кДж, ал 1 г май — 38,9 кДж энергия береді."},
 {c:"Қандағы глюкоза",q:"Ересек адамда қандағы глюкозаның қалыпты деңгейі қандай?",o:["3,3–5,5 ммоль/л","0,5–1,0 ммоль/л","8–12 ммоль/л","15–20 ммоль/л"],a:0,e:"Аш қарында қандағы глюкоза 3,3–5,5 ммоль/л шамасында болуы керек; тұрақтылықты инсулин мен глюкагон реттейді."},
 {c:"Ыдырау өнімдері",q:"Көмірсу ағзада толық ыдырағанда қандай өнімдер түзіледі?",o:["Көмірқышқыл газы мен су","Несепнәр мен су","Май қышқылдары мен глицерин","Аминқышқылдар"],a:0,e:"Аэробты ыдырау кезінде көмірсулар CO2 мен H2O-ға дейін тотығып, энергия (АТФ) береді."}
];
function myqGet(){try{var a=JSON.parse(store('za_myq')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function myqSet(a){store('za_myq',JSON.stringify(a))}

/* ================= packs: кез келген тақырыпқа арналған сұрақ жинағы ================= */
var DEF_QUESTIONS=QUIZ_POOL;
function qFix(x){
  if(!x||typeof x!=='object')return null;
  var o=Array.isArray(x.o)?x.o.slice(0,4):[];
  while(o.length<4)o.push('');
  o=o.map(function(v){return String(v).slice(0,90)});
  var a=Math.max(0,Math.min(3,+x.a||0));
  return {c:String(x.c||'').slice(0,18),q:String(x.q||'').slice(0,160),o:o,a:a,e:String(x.e||'').slice(0,220)}}
function packsLoad(){try{var a=JSON.parse(store('za_packs3d')||'null');
  if(Array.isArray(a))return a.map(function(p){return {id:String(p.id||'p'),title:String(p.title||'Тақырып').slice(0,40),
    qs:(Array.isArray(p.qs)?p.qs:[]).map(qFix).filter(Boolean)}}).filter(function(p){return p.id})}catch(e){}
  return null}
var PACKS=packsLoad();
/* 2026-10: бұрынғы әдепкі «энергия шығыны» жинағы сурақтар-энергия-10.json көшірмесінде; ойында тек жаңа тақырып қалады */
if(PACKS&&PACKS.length){
  var kept=PACKS.filter(function(p){return !(p.id==='p-energy'||p.title==='Ағзаның тәуліктік энергия шығыны')});
  if(kept.length!==PACKS.length){PACKS=kept;packsSave()}}
if(!PACKS||!PACKS.length){
  PACKS=[{id:'p-carbs',title:'Көмірсу',qs:DEF_QUESTIONS.map(qFix)}];
  var legacy=myqGet();
  if(legacy.length)PACKS.push({id:'p-own',title:'Менің сұрақтарым',qs:legacy.map(qFix).filter(Boolean)});
  store('za_pack3d',PACKS[0].id);packsSave()}
function packsSave(){store('za_packs3d',JSON.stringify(PACKS))}
function packById(id){for(var i=0;i<PACKS.length;i++)if(PACKS[i].id===id)return PACKS[i];return null}

function parseQText(txt,title){
  var lines=String(txt||'').split(/\r?\n/).map(function(s){return s.trim()}).filter(function(s){return s.length});
  var explicit=/^\+/.test(lines.join('\n'))||lines.some(function(s){return /^[+]/.test(s)});
  var blocks=[],cur=null;
  function push(){if(cur&&(cur.q||cur.ok)){blocks.push(cur)}cur=null}
  lines.forEach(function(s){
    var m;
    if(explicit){
      if(s.charAt(0)==='+'){if(cur){cur.ok=s.slice(1).trim();cur.opts=cur.opts||[]}return}
      if(s.charAt(0)==='-'||s.charAt(0)==='•'){if(cur){cur.opts=cur.opts||[];cur.opts.push(s.slice(1).trim())}return}
      if(/^[-—–:]\s/.test(s)||/^[-—–:]/.test(s)){if(cur){cur.ok=s.replace(/^[-—–:]\s*/,'')}return}
      if(cur&&cur.q){push()}
      if(!cur)cur={q:'',ok:'',opts:[]};
      cur.q=s.replace(/^\d+[.)]\s*/,'').replace(/^[-—–:]\s*/,'');
      return}
    if(/^[-—–:]/.test(s)){
      var ans=s.replace(/^[-—–:]\s*/,'').trim();
      if(!cur){cur={q:'',ok:'',opts:[]}}
      if(!cur.ok)cur.ok=ans;else cur.opts.push(ans);return}
    push();cur={q:s.replace(/^\d+[.)]\s*/,'').trim(),ok:'',opts:[]}});
  push();
  var out=blocks.filter(function(b){return b.q&&b.ok});
  var cat=(title||'Менің сұрағым').slice(0,18);
  var qs=out.map(function(b){
    var opts=[b.ok],pool=(b.opts||[]).filter(function(v){return v&&v!==b.ok});
    for(var i=0;i<pool.length&&opts.length<4;i++)if(opts.indexOf(pool[i])<0)opts.push(pool[i]);
    return qFix({c:cat,q:b.q,o:opts,a:0,e:b.ok})});
  var answers=qs.map(function(q){return q.o[0]});
  qs.forEach(function(q,i){
    var k=1;
    while(q.o.length<4&&k<qs.length+4){
      var cand=answers[(i+k)%Math.max(1,answers.length)];
      if(cand&&cand!==q.o[0]&&q.o.indexOf(cand)<0)q.o.push(cand);
      else if(!cand)q.o.push(ANSOPT);
      k++}
    while(q.o.length<4)q.o.push(ANSOPT)});
  return qs}

function mat(c,o){var x={color:c,flatShading:true,side:THREE.DoubleSide};if(o)for(var k in o)x[k]=o[k];return new THREE.MeshLambertMaterial(x)}
function glassMat(c){return new THREE.MeshPhongMaterial({color:c||0x14284a,shininess:96,specular:0xa8c8ff,side:THREE.DoubleSide})}
function basic(c,o){var x={color:c};if(o)for(var k in o)x[k]=o[k];return new THREE.MeshBasicMaterial(x)}

/* tapered, swept wing: span along +X, chord along +Z (nose = +Z), thickness Y */
function wingGeo(len,cR,cT,th,sweep,dih){
  var g=new THREE.BoxGeometry(len,th,cR,Math.max(8,Math.round(len)),1,1),p=g.attributes.position;
  for(var i=0;i<p.count;i++){
    var x=p.getX(i),y=p.getY(i),z=p.getZ(i),t=clamp(x/len+.5,0,1);
    p.setZ(i,z*(1+(cT/cR-1)*t)-sweep*t);
    p.setY(i,y+dih*t*t);
  }
  g.computeVertexNormals();g.translate(len/2,0,0);return g}
function mesh(g,m,x,y,z){var o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
function pair(geo,m,x,y,z,z2){ /* right + mirrored left */
  var a=mesh(geo,m,x,y,z);a.geometry=geo;
  var b=mesh(geo,m,-x,y,z2===undefined?z:z2);b.scale.x=-1;
  var g=new THREE.Group();g.add(a);g.add(b);return g}

    opacity:.16,depthWrite:false,side:THREE.DoubleSide}));disc.position.z=.3;g.add(disc);
  g.userData.axis='z';return g}
function rotorAssembly(r){
  var g=new THREE.Group();

    life:0,tgt:0};

    blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));

function updatePlanes(dt,t){
  for(var i=W.planes.length-1;i>=0;i--){
    var o=W.planes[i];
    if(o.dead){o.grp.scale.multiplyScalar(1);continue}
    if(!o.frozen){
      o.z+=o.sp*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
      o.y+=Math.sin(t*1.9+o.ph)*7*dt*2.2;
      if(o.x<-165||o.x>165)o.vx*=-1;
    }
    o.grp.position.set(o.x,o.y,o.z);
    var bank=clamp(-o.vx/o.sp,-.6,.6);
    o.grp.rotation.z=-bank*.85+Math.sin(t*1.3+o.ph)*.05;
    o.grp.rotation.y=clamp(o.vx/o.sp,-.5,.5)*.6;
    o.grp.rotation.x=clamp(o.vy/o.sp,-.4,.4)*.5+Math.sin(t*2.2+o.ph)*.03;
    for(var s=0;s<o.spin.length;s++)o.spin[s].o.rotation[o.spin[s].o.userData.axis||'z']+=o.spin[s].r*dt;
    for(var b=0;b<o.blink.length;b++)o.blink[b].visible=(t*1.6+b*.5)%1>.42;
    for(var u=0;u<o.burn.length;u++){
      var f=.78+Math.abs(Math.sin(t*22+u))*.42;
      o.burn[u].scale.set(f,1+(1-f)*.5,f);o.burn[u].material.opacity=.7+Math.abs(Math.sin(t*17+u))*.3}
    var d=o.grp.position.distanceTo(W.cam.position);
    var near=clamp(1-(d-120)/420,0,1);
    o.lock.material.opacity=near*(.35+Math.sin(t*5)*.16);
    o.lock.scale.setScalar(70+near*46);
    o.tgt=near;
    if(o.z>W.cam.position.z+80||o.y<-30){
      if(!o.frozen){
        if(PG.on&&PG.cur!==o)escapePlane(o);
        else if(!PG.on)removePlane(o);
      }
    }
    placeLabel(o);
  }
}

function updateFX(dt){
  for(var i=W.fx.length-1;i>=0;i--){
    var f=W.fx[i];f.t+=dt;var k=f.t/f.dur;
    if(k>=1){killFX(f);W.fx.splice(i,1);continue}
    var e=1-Math.pow(1-k,2.4);
    for(var b=0;b<f.balls.length;b++){
      var o=f.balls[b],bk=clamp((k-o.d)/.62,0,1);
      var s=o.s0+(1-Math.pow(1-bk,2))*(o.s1-o.s0);
      o.m.scale.set(s,s,1);
      o.m.material.opacity=Math.min(1,(1-bk)*2.3);
      o.m.position.copy(o.off).addScaledVector(o.off,1+bk*.9);
      o.m.material.rotation=k*1.6*(b%2?1:-1)}
    f.core.scale.setScalar(28+e*24);f.core.material.opacity=Math.max(0,1-k*5.5);
    f.wave.scale.setScalar(18+e*152);f.wave.material.opacity=.95*Math.max(0,1-k*3.4);
    for(var p=0;p<f.parts.length;p++){
      var q2=f.parts[p];q2.v.y-=110*dt;q2.m.position.addScaledVector(q2.v,dt);
      q2.m.rotation.x+=q2.w.x*dt;q2.m.rotation.y+=q2.w.y*dt;q2.m.rotation.z+=q2.w.z*dt;
      if(k>.55){q2.m.material.transparent=true;q2.m.material.opacity=Math.max(0,1-(k-.55)/.45)}}
    for(var n=0;n<f.embers.length;n++){
      var m2=f.embers[n];if(k<m2.d)continue;
      var nk=(k-m2.d)/(f.dur-m2.d);
      m2.v.y-=64*dt;m2.m.position.addScaledVector(m2.v,dt);
      m2.m.material.opacity=Math.max(0,1-nk*1.5);m2.m.scale.setScalar((1-nk*.5)*8)}
    for(var s3=0;s3<f.smoke.length;s3++){
      var mm=f.smoke[s3];if(k<mm.d)continue;
      var sk=(k-mm.d)/(f.dur-mm.d);
      mm.m.position.addScaledVector(mm.v,dt);mm.v.y*=.985;
      mm.m.scale.setScalar(12+sk*62);mm.m.material.opacity=.34*Math.max(0,1-sk*1.15)}
    W.flash.intensity*=Math.pow(2e-5,dt);
  }}

function onTap(ev){
  if(!PG.on||PG.cur||PG.locked||PG.paused)return;

  for(var i=0;i<W.planes.length;i++){

    _pv.copy(o.grp.position).project(W.cam);
    if(_pv.z>1)continue;
    var sx=(_pv.x*.5+.5)*innerWidth,sy=(-_pv.y*.5+.5)*innerHeight;
    var dist=Math.max(60,o.grp.position.distanceTo(W.cam.position));
    var pxPerUnit=innerHeight/(2*dist*Math.tan(fov/2));
    var rad=Math.max(84,clamp(o.cr.sc*34*pxPerUnit,84,190))+16;
    var d=Math.sqrt((sx-ev.clientX)*(sx-ev.clientX)+(sy-ev.clientY)*(sy-ev.clientY));
    if(d<=rad&&d<bd){bd=d;best=o}}
  if(best)openPlaneQ(best)}

  W.par.x+=(W.par.tx-W.par.x)*k;W.par.y+=(W.par.ty-W.par.y)*k;
  var px=W.par.x*44,py=-W.par.y*26;
  W.cam.position.set(W.camPos.x+px+Math.sin(t*47)*s*7,
    W.camPos.y+py+Math.sin(t*39+1)*s*7+Math.sin(t*.6)*2.4,
    W.camPos.z+Math.cos(t*43)*s*5);
  W.camAim.x=Math.sin(t*.12)*22+Math.sin(t*51)*s*10-px*.45;
  W.camAim.y=168-py*.5;
  W.cam.lookAt(W.camAim)}

/* ---------- PeerJS: жасаушы ---------- */
function startHost(code,tries){
  if(!window.Peer){onlineNoLib();return}
  var p;try{p=new Peer('zat-'+code,{debug:0})}catch(e){onlineNoLib();return}
  ONL.peer=p;ONL.code=code;
  p.on('open',function(){ONL.ready=true;if($('scr').classList.contains('show')&&ONL.active)screenOnline();say('ok','Бөлме ашық · '+code)});
  p.on('connection',function(c){
    ONL.conns[c.peer]=c;
    c.on('data',function(m){hostMsg(m,c)});
    c.on('close',function(){dropUser(c.peer)});
    c.on('error',function(){dropUser(c.peer)});
    if(ONL.playing){try{c.send({t:'full'})}catch(e){}}});
  p.on('error',function(err){
    var ty=(err&&err.type)||'error';
    if(ty==='unavailable-id'&&tries<8){try{p.destroy()}catch(e){}
      ONL.code=genCode();ONL.tries=tries+1;startHost(ONL.code,tries+1);return}
    if(ty==='peer-unavailable')return;
    say('bad',ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='browser-incompatible'
      ?'Байланыс қатесі ('+ty+')':'Бөлме қатесі ('+ty+')');
    toast('Интернетті тексеріп, қайта аш')});
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
}
function hostMsg(m,c){
  if(!m||typeof m!=='object')return;
  var j=ONL.idx[c.peer];
  if(m.t==='join'){
    if(ONL.playing||ONL.players.length>=ONL_MAX){try{c.send({t:'full'})}catch(e){}return}
    if(j!=null&&ONL.players[j]){ONL.players[j].gone=false;try{c.send({t:'welcome',you:j,pl:onlNames(),qs:ONL.qs,
        topic:ONL.topic,dur:ONL.dur,rounds:ONL.rounds,ht:Date.now()})}catch(e){}return}
    var nm=trimS(m.n).slice(0,14)||'Қонақ';
    for(var i=0;i<ONL.players.length;i++)if(ONL.players[i].n.toLowerCase()===nm.toLowerCase()){nm=nm.slice(0,10)+'·'+(i+1);break}
    var np=newPly(nm,false);np.peer=c.peer;ONL.players.push(np);ONL.idx[c.peer]=ONL.players.length-1;
    try{c.send({t:'welcome',you:ONL.players.length-1,pl:onlNames(),qs:ONL.qs,topic:ONL.topic,dur:ONL.dur,
      rounds:ONL.rounds,ht:Date.now()})}catch(e){}
    onlineSend({t:'who',pl:onlNames()});
    sfx.join();toast(nm+' қосылды ('+ONL.players.length+')');
    if($('scr').classList.contains('show'))screenOnline();else updateOnlHud();
    return}
  if(m.t==='ans'){if(j==null)return;hostAnswer(j,m.i,m.ok,m.ms);return}
}
function dropUser(pid){
  delete ONL.conns[pid];
  var j=ONL.idx[pid];delete ONL.idx[pid];
  if(j==null||!ONL.players[j])return;
  ONL.players[j].gone=true;ONL.players[j].peer=null;
  toast(ONL.players[j].n+' шығып кетті');
  if(sfx.deny)sfx.deny();
  if(ONL.playing){
    if(ONL.host){onlineSend({t:'board',s:scores(),st:streaks(),an:flags()});hostCheckFinish()}
    updateOnlHud()}
  else if($('scr').classList.contains('show')&&!ONL.ended)screenOnline()}
function hostCheckFinish(){
  if(!ONL.host||!ONL.playing)return;
  if(allDone()){clearTimeout(ONL.watch);ONL.watch=setTimeout(hostFinishRound,700)}}

/* ---------- PeerJS: қонақ ---------- */
function joinRoom(code){
  if(!window.Peer){onlineNoLib();return}
  var p;try{p=new Peer(undefined,{debug:0})}catch(e){onlineNoLib();return}
  ONL.peer=p;say('wait','«'+code+'» бөлмесі ізделуде…');
  var fail=setTimeout(function(){if(!ONL.ready){say('bad','Бөлме табылмады');
    toast('Кодты тексер немесе жасаушыдан қайта жібертуін сұра')}},16000);
  p.on('open',function(){
    var c;try{c=p.connect('zat-'+code,{reliable:true})}catch(e){clearTimeout(fail);onlineNoLib();return}
    ONL.conn=c;
    c.on('open',function(){ONL.ready=true;say('wait','Қосылдың · тізім күт…');
      try{c.send({t:'join',n:oName()})}catch(e){}});
    c.on('data',guestMsg);
    c.on('close',function(){if(!ONL.active)return;
      if(ONL.playing){toast('Бөлме жабылды');onlineTeardown();ONL.tab='join';screenOnline()}
      else{say('bad','Байланыс үзілді');if($('scr').classList.contains('show'))screenOnline()}});
    c.on('error',function(){say('bad','Байланыс қатесі')})});
  p.on('error',function(err){clearTimeout(fail);var ty=(err&&err.type)||'';
    say('bad',ty==='peer-unavailable'?'Бөлме табылмады':'Қосылу қатесі');
    toast('«'+code+'» бөлмесіне кірмеді');ONL.active=false;ONL.host=false;
    if($('scr').classList.contains('show'))screenOnline()});
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
}
function guestMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='full'){say('bad','Бөлме толы');toast('Бөлме толы немесе жарыс басталып кеткен');
    ONL.active=false;if($('scr').classList.contains('show'))screenOnline();return}
  if(m.t==='welcome'){
    ONL.me=clamp(+m.you||0,0,20);ONL.ready=true;ONL.active=true;
    ONL.qs=(Array.isArray(m.qs)?m.qs:[]).map(qFix).filter(Boolean);
    ONL.topic=trimS(m.topic).slice(0,40)||'Онлайн жарыс';
    ONL.dur=clamp(+m.dur||20000,5000,60000);
    ONL.rounds=clamp(+m.rounds||ONL.qs.length||1,1,60);
    ONL.off=Date.now()-(+m.ht||Date.now());
    setRoster(m.pl||[]);
    if(!ONL.players[ONL.me])ONL.me=0;
    say('ok','Сәлем, '+oName()+'! '+ONL.players.length+' ойыншы');
    if($('scr').classList.contains('show'))screenOnline();updateOnlHud();return}
  if(m.t==='who'){setRoster(m.pl||[]);
    if($('scr').classList.contains('show')&&!ONL.playing)screenOnline();updateOnlHud();return}
  if(m.t==='go'){
    ONL.off=Date.now()-(+m.ht||Date.now());
    ONL.dur=clamp(+m.dur||ONL.dur,5000,60000);
    var d=(+m.startAt||Date.now())-ONL.off-Date.now();
    if(!(d>0))d=250;d=Math.min(d,6000);
    clearTimeout(ONL.watch);
    ONL.watch=setTimeout(function(){beginRound(+m.i||0,ONL.dur)},d);
    say('ok','Сұрақ '+Math.max(1,Math.round(d/1000))+' сек');
    return}
  if(m.t==='board'){ONL.off=Date.now()-(+m.ht||Date.now());applyBoard(m);if(ONL.playing)onlineHud();maybeResolve();updateOnlHud();return}
  if(m.t==='end'){applyBoard({s:(m.p||[]).map(function(r){return r.s})});
    finishRace(m.p||null);return}
  if(m.t==='kick'){onlineTeardown();ONL.tab='join';screenOnline();return}
}
function onlineSend(msg){
  if(!ONL.active||!window.Peer)return;
  msg.ht=Date.now();
  if(ONL.host){for(var k in ONL.conns){try{ONL.conns[k].send(msg)}catch(e){}}}
  else{try{if(ONL.conn&&ONL.conn.open)ONL.conn.send(msg)}catch(e){}}
}

/* ---------- жарыс айналымы ---------- */
function onlineStartRace(){
  if(!ONL.host){toast('Жарысты бөлме жасаушы бастайды');return}
  if(ONL.players.length<2){toast('Кемінде 2 ойыншы керек');return}
  if(!ONL.qs.length){toast('Сұрақ жоқ');return}
  ONL.rounds=clamp(ONL.rounds||1,1,Math.min(60,ONL.qs.length));
  for(var i=0;i<ONL.players.length;i++){var p=ONL.players[i];p.s=0;p.st=0;p.an=false;p.gone=false}
  ONL.ended=false;ONL.round=-1;
  onlineSend({t:'start',rounds:ONL.rounds,dur:ONL.dur});
  sfx.win();armAudio();hostRound(0);
}
function hostRound(i){
  if(!ONL.host||!ONL.active)return;
  ONL.round=i;
  var startAt=Date.now()+1600;
  onlineSend({t:'go',i:i,dur:ONL.dur,startAt:startAt});
  clearTimeout(ONL.watch);
  ONL.watch=setTimeout(function(){beginRound(i,ONL.dur)},1600);
  say('ok','Сұрақ '+(i+1)+'/'+ONL.rounds+' дайындалуда');
}
function beginRound(i,dur){
  if(!ONL.active)return;
  i=clamp(i|0,0,Math.max(0,ONL.qs.length-1));
  var q=ONL.qs[i];if(!q){if(ONL.host)finishRaceHost();return}
  ONL.playing=true;ONL.round=i;ONL.answered=false;ONL.resolved=false;ONL.rDur=clamp(dur||20000,5000,60000);
  for(var k=0;k<ONL.players.length;k++)ONL.players[k].an=false;
  $('podium').classList.remove('show','fade');
  $('sheet').classList.remove('show');PG.cur=null;PG.locked=false;
  for(var j=W.planes.length-1;j>=0;j--)removePlane(W.planes[j]);
  PG.on=true;PG.decor=false;PG.over=false;PG.paused=false;PG.nextAt=1e15;
  ONL.serial++;
  var cr=craftFor(1+(i%3),ONL.serial);
  var o=addPlane(cr,Object.assign({pack:ONL.topic,online:true},q));
  $('hud').classList.remove('hide');$('bar').classList.add('hide');hide();
  openPlaneQ(o);
  ONL.r0=performance.now();PG.t0=ONL.r0;PG.dur=ONL.rDur;PG.locked=false;
  $('ring').classList.remove('low');$('ringNum').textContent=Math.ceil(ONL.rDur/1000);
  armAudio();startMusic('calm');
  if(ONL.host){clearTimeout(ONL.watch);ONL.watch=setTimeout(hostFinishRound,ONL.rDur+900)}
  onlineHud();updateOnlHud();
  say('ok','Сұрақ '+(i+1)+'/'+ONL.rounds+' · '+Math.round(ONL.rDur/1000)+' сек');
  banner('СҰРАҚ '+(i+1)+'/'+ONL.rounds,'БАСТАЛДЫ','Кім тез тапса — ұпай көп');
}
function onlineHud(){
  var me=myP();PG.score=me?me.s:0;PG.wave=ONL.round+1;hud();
  var w=$('hWave').querySelector('.lbl');if(w)w.textContent='Сұрақ';
  var s=$('hScore').querySelector('.lbl');if(s)s.textContent='Ұпай';
  var st=$('hStreak');if(st&&me&&me.st>=2){st.style.display='';st.innerHTML='Комбо ×'+me.st;st.classList.add('hot')}
  else if(st)st.style.display='none';
  hearts();
}
function onlineAnswer(btn,o,q,ok){
  PG.locked=true;ONL.answered=true;
  var ms=clamp(performance.now()-ONL.r0,0,ONL.rDur);
  planeReveal(q.a);
  if(ok){verdict(true,'Дұрыс!');sfx.correct();
    $('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');
    setTimeout(function(){boomPlane(o)},380)}
  else{btn.classList.add('wrong');verdict(false,'Қате');sfx.wrong();
    setTimeout(function(){fleePlane(o)},520)}
  $('ringNum').textContent='·';$('ring').classList.remove('low');
  $('qMeta').innerHTML='<span class="mpill own">Жауабың кетті · бәсекелестерді күт</span>';
  onlineSend({t:'ans',i:ONL.round,ok:ok,ms:Math.round(ms)});
  if(ONL.host)hostAnswer(ONL.me,ONL.round,ok,ms);
  updateOnlHud();
}
function onlineTimeout(){
  if(!ONL.playing||!PG.cur||PG.locked)return;
  PG.locked=true;ONL.answered=true;
  var o=PG.cur;
  planeReveal(o.q.a);verdict(false,'Уақыт');sfx.wrong();
  $('ringNum').textContent='·';
  $('qMeta').innerHTML='<span class="mpill own">Уақыт бітті · нәтижені күт</span>';
  setTimeout(function(){fleePlane(o)},320);
  PG.cur=null;
  onlineSend({t:'ans',i:ONL.round,ok:false,ms:Math.round(ONL.rDur)});
  if(ONL.host)hostAnswer(ONL.me,ONL.round,false,ONL.rDur);
  updateOnlHud();
}
function hostAnswer(j,i,ok,ms){
  if(!ONL.host||!ONL.playing)return;
  if((i|0)!==ONL.round)return;
  var p=ONL.players[j];if(!p||p.gone||p.an)return;
  p.an=true;
  ms=clamp(+ms||ONL.rDur,0,ONL.rDur);
  if(ok){var sp=Math.max(0,Math.round((1-ms/ONL.rDur)*8));p.st++;p.s+=10+sp+Math.min(p.st-1,4)*2}
  else p.st=0;
  onlineSend({t:'board',s:scores(),st:streaks(),an:flags()});
  updateOnlHud();onlineHud();
  if(allDone()){clearTimeout(ONL.watch);ONL.watch=setTimeout(hostFinishRound,700)}
}
function scores(){return ONL.players.map(function(p){return p.s})}
function streaks(){return ONL.players.map(function(p){return p.st})}
function flags(){return ONL.players.map(function(p){return p.an?1:0})}
function allDone(){for(var i=0;i<ONL.players.length;i++)if(!ONL.players[i].gone&&!ONL.players[i].an)return false;return true}
function applyBoard(m){
  var s=m.s||[],st=m.st||[],an=m.an||[];
  for(var i=0;i<ONL.players.length;i++){
    if(s[i]!=null)ONL.players[i].s=+s[i]||0;
    if(st[i]!=null)ONL.players[i].st=+st[i]||0;
    if(an[i]!=null)ONL.players[i].an=!!an[i]}
}
function maybeResolve(){if(ONL.playing&&allDone())resolveRound()}
function hostFinishRound(){
  if(!ONL.host||!ONL.playing)return;
  clearTimeout(ONL.watch);
  for(var i=0;i<ONL.players.length;i++){var p=ONL.players[i];if(p.gone)continue;
    if(!p.an){p.an=true;p.st=0}}
  onlineSend({t:'board',s:scores(),st:streaks(),an:flags()});
  updateOnlHud();
  ONL.playing=false;
  resolveRound();
  var next=ONL.round+1;
  if(next>=ONL.rounds||next>=ONL.qs.length){ONL.watch=setTimeout(finishRaceHost,1500);return}
  ONL.watch=setTimeout(function(){hostRound(next)},2200);
}
function resolveRound(){
  if(ONL.resolved)return;ONL.resolved=true;
  if(PG.cur){var o=PG.cur;PG.cur=null;PG.locked=false;setTimeout(function(){if(!o.dead)fleePlane(o)},200)}
  $('sheet').classList.remove('show');
  var rk=liveRank(),me=myP(),pos=me?rk.indexOf(me)+1:0,lead=rk[0]?rk[0].s:0;
  var left=Math.max(0,ONL.rounds-ONL.round-1);
  var gap=pos>1&&me?(' · көшбасшыға '+(lead-me.s)+' ұпай'):'';
  toast(pos?(pos+'-орын'+gap+' · '+left+' сұрақ қалды'):'келесі сұрақ…');
  say('wait','Келесі сұрақ дайын…');
}
function liveRank(){return ONL.players.slice().sort(function(a,b){return b.s-a.s})}
function updateOnlHud(){
  var e=$('onlHud');if(!e)return;
  if(!ONL.active||!ONL.players.length){e.classList.remove('show');return}
  var rk=liveRank(),h='<b>Тікелей тұрмыс · '+ONL.qLabel()+'</b>';
  for(var i=0;i<rk.length;i++){var p=rk[i];
    h+='<div class="r'+(p===myP()?' me':'')+(p.an?' done':'')+'"><i>'+(p.gone?'×':(i+1))+'</i><u>'+esc(p.n)+'</u><s>'+p.s+'</s></div>'}
  e.innerHTML=h;e.classList.add('show');
}
ONL.qLabel=function(){return (ONL.playing?('сұрақ '+(ONL.round+1)+'/'+ONL.rounds):(ONL.ended?'жарыс бітті':'жарыс күтуде'))};

/* ---------- қорытынды: толық орындар + анимация ---------- */
function finishRaceHost(){
  if(!ONL.active)return;
  ONL.playing=false;ONL.ended=true;clearTimeout(ONL.watch);
  onlineSend({t:'end',p:ONL.players.map(function(p){return {n:p.n,s:p.s,g:p.gone?1:0}})});
  finishRace(null);
}
function finishRace(list){
  ONL.playing=false;ONL.ended=true;clearTimeout(ONL.watch);
  if(list&&list.length){var old=ONL.players;
    ONL.players=list.map(function(r,i){var nm=trimS(r.n).slice(0,14)||('Ойыншы '+(i+1));
      return {n:nm,s:+r.s||0,st:0,an:true,gone:!!r.g,host:old[i]?old[i].host:i===0}})}
  $('sheet').classList.remove('show');$('onlHud').classList.remove('show');
  $('hud').classList.add('hide');$('bar').classList.add('hide');
  PG.on=false;PG.decor=true;PG.cur=null;PG.locked=false;PG.nextAt=performance.now()+2400;
  for(var j=W.planes.length-1;j>=0;j--)removePlane(W.planes[j]);
  setMusicMode('win');armAudio();startMusic('win');
  showPodium3D();
}
function salute3D(){
  var n=0,iv=setInterval(function(){
    n++;
    var v=new THREE.Vector3(rnd(-210,210),rnd(150,290),rnd(-520,-190));
    boomFX(v,CRAFTS[(Math.random()*4)|0]);
    if(sfx.on&&AC){tone(rnd(520,1180),.16,'triangle',.09,undefined,at0());}
    if(n>=7)clearInterval(iv)},520);
  setTimeout(function(){clearInterval(iv)},6000);
}
function confetti(count){
  var cols=['#fcd34d','#4f6ef7','#16b981','#ef4444','#9b5cf6','#ffffff'];
  for(var i=0;i<count;i++){
    var s=document.createElement('span');s.className='cf';
    s.style.left=rnd(-2,innerWidth+2)+'px';
    s.style.background=cols[i%cols.length];
    s.style.animationDuration=rnd(2.1,4.4)+'s';
    s.style.animationDelay=rnd(0,1.4)+'s';
    s.style.transform='rotate('+rnd(0,180)+'deg)';
    s.style.width=rnd(6,11).toFixed(0)+'px';s.style.height=rnd(10,18).toFixed(0)+'px';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},6400)})(s)}
}
function showPodium3D(){
  var rk=liveRank();
  for(var i=0;i<rk.length;i++)rk[i].rank=i+1;
  var w=rk[0];
  var pd=$('podium');pd.classList.remove('fade');pd.classList.add('show');
  $('pdKick').textContent='ЖАРЫС БІТТІ · '+ONL.rounds+' СҰРАҚ · '+ONL.topic.toUpperCase();
  var nm=$('pdName'),h='';
  for(var k=0;k<w.n.length;k++)h+='<span class="ltr" style="animation-delay:'+(0.9+k*.05).toFixed(2)+'s">'+esc(w.n.charAt(k))+'</span>';
  nm.innerHTML=h;
  $('pdSub').textContent=w.s+' ұпай · жеңімпаз'+(ONL.players.length>1?(' · сенің орның — '+(rk.indexOf(myP())+1)):'');
  var top=rk.slice(0,3),seq=top.length===3?[top[1],top[0],top[2]]:(top.length===2?[top[1],top[0]]:[top[0]]);
  var ph='';
  for(var m=0;m<seq.length;m++){var p=seq[m],cls=p.rank===1?'g':(p.rank===2?'s':'b'),
    dly=p.rank===1?.42:(p.rank===2?.66:.86);
    ph+='<div class="pod '+cls+'" style="animation-delay:'+dly+'s">'
      +(p.rank===1?'<svg class="crn" viewBox="0 0 64 64"><path d="M8 48l6-30 10 12 8-18 8 18 10-12 6 30z" fill="#fcd34d" stroke="#e08b0b" stroke-width="2.5" stroke-linejoin="round"/><rect x="8" y="49" width="48" height="7" rx="3" fill="#f59e0b"/></svg>':'')
      +'<div class="av" style="background:'+pColor(p.n)+'">'+esc(p.n.charAt(0).toUpperCase())+'</div>'
      +'<div class="nm">'+esc(p.n)+'</div><div class="pt">'+p.s+' ұпай</div>'
      +'<div class="bs"><em>'+p.rank+'</em></div></div>'}
  $('pdPods').innerHTML=ph;
  var rh='';
  for(var z=3;z<rk.length;z++){var q=rk[z];
    rh+='<div class="prow" style="animation-delay:'+(1.2+(z-3)*.13).toFixed(2)+'s">'
      +'<span class="pi" style="background:'+pColor(q.n)+'">'+q.rank+'</span>'
      +'<span class="pu">'+esc(q.n)+(q.gone?' (шықты)':'')+'</span>'
      +'<span class="pv">'+q.s+' ұпай</span></div>'}
  $('pdRows').innerHTML=rh;
  /* орын сайын дыбыс */
  var delays=[420,660,860,1000,1130,1260,1390,1520];
  for(var d=0;d<Math.min(rk.length,8);d++)(function(idx,delay){
    setTimeout(function(){sfx.place(idx+1)},delay)})(d,delays[d]);
  setTimeout(function(){sfx.win()},1700);
  setTimeout(function(){confetti(70)},700);
  setTimeout(function(){confetti(45)},2100);
  setTimeout(salute3D,1000);
  $('pdAgain').onclick=function(){sfx.click();
    if(ONL.host){onlineStartRace()}
    else{say('wait','Жасаушыны күт…');toast('Жарысты жасаушы қайта бастауы керек')}
    if(ONL.active)screenOnline()};
  $('pdHome').onclick=function(){sfx.click();onlineTeardown();ONL.tab='host';screenStart()};
}

/* ---------- тазалау ---------- */
function onlineTeardown(keepPlayers){
  clearTimeout(ONL.watch);ONL.watch=null;
  if(ONL.active&&ONL.peer){try{onlineSend({t:'kick'})}catch(e){}}
  try{if(ONL.conn)ONL.conn.close()}catch(e){}
  for(var k in ONL.conns){try{ONL.conns[k].close()}catch(e){}}
  try{if(ONL.peer)ONL.peer.destroy()}catch(e){}
  ONL.peer=null;ONL.conn=null;ONL.conns={};ONL.idx={};
  ONL.active=false;ONL.host=false;ONL.ready=false;ONL.playing=false;ONL.ended=false;
  ONL.code='';ONL.round=0;ONL.answered=false;ONL.me=0;ONL.off=0;ONL.serial=0;
  if(!keepPlayers)ONL.players=[];
  ONL.qs=packQuestions(actPack()).map(function(q){return Object.assign({pack:actPack().title},q)});
  ONL.topic=actPack().title;
  $('onlHud').classList.remove('show');$('onlHud').innerHTML='';
  $('podium').classList.add('fade');
  setTimeout(function(){$('podium').classList.remove('show','fade')},380);
  var w=$('hWave').querySelector('.lbl');if(w)w.textContent='Толқын';
  var s=$('hScore').querySelector('.lbl');if(s)s.textContent='Ұпай';
}

/* ================= power-ups ================= */
function usePower(p){
  if(p==='edit'){screenEdit();return}
  if(p==='quit'){
    stopMusic();
    if(ONL.active)onlineTeardown();
    PG.paused=false;PG.on=false;PG.over=false;PG.cur=null;PG.locked=false;PG.shield=false;
    $('sheet').classList.remove('show');
    if(PG.score>PG.best){PG.best=PG.score;store('za_best3d',String(PG.best))}
    for(var i=W.planes.length-1;i>=0;i--)removePlane(W.planes[i]);
    screenStart();return}
  if(PG.paused)return;
  if(p==='fifty'){
    if(!PG.cur||PG.locked){toast('Алдымен ұшақты түртіп сұрағын аш');return}
    if(PG.fifty<=0)return;
    var a=PG.cur.q.a,wr=shuffle([0,1,2,3].filter(function(i){return i!==a})).slice(0,2);
    Array.prototype.forEach.call($('opts').children,function(b){
      if(wr.indexOf(+b.dataset.i)>-1){b.classList.add('dim');b.style.pointerEvents='none'}});
    PG.fifty--;sfx.power();hud();toast('50/50 қолданылды')}
  if(p==='shield'){
    if(PG.shields<=0){toast('Қалқан жоқ — толқын сайын бір дана жинайсың');return}
    PG.shields=0;PG.shield=true;sfx.power();
    if(PG.cur&&!PG.locked){PG.dur+=30000;toast('Қалқан: +30 секунд · бір қатеден сақтайды')}
    else{PG.bonusNext+=30000;toast('Қалқан сақталды: келесі сұраққа +30 секунд')}
    hud()}}

/* ================= loop ================= */
function animate(){
  requestAnimationFrame(animate);
  var now=performance.now(),dt=Math.min(.05,(now-T)/1000);T=now;
  if(PG.paused){W.r.render(W.scene,W.cam);return}
  W.t+=dt;
  if(PG.on&&!PG.over){
    if(!PG.cur){PG.locked=false;if(PG.tension){PG.tension=false;setMusicMode('calm')}}
    if(!ONL.playing&&now>PG.nextAt&&W.planes.length<(PG.wave<3?2:(PG.wave<7?3:4)))spawn();
    tickSheet(now)}
  else if(PG.decor&&W.planes.length<2&&now>PG.nextAt){
    PG.serial++;addPlane(CRAFTS[PG.serial%4],{c:'Демалыс',q:'',o:['','','',''],a:0});
    PG.nextAt=now+2600}
  updatePlanes(dt,W.t);updateFX(dt);updateWorld(dt,W.t);updateCam(dt,W.t);
  W.r.render(W.scene,W.cam)}

function initBar(){
  $('bar').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    usePower(b.dataset.p)});
  hud()}

/* ================= boot ================= */
function boot(){
  if(!hasGL()||!window.THREE){window.__fail();return}
  initWorld();initLabels();initPick();initBar();
  PG.best=+(store('za_best3d')||0);
  PG.tSec=tSecGet();
  sfx.on=store('za_snd3d')!=='0';sndIcon();
  $('btnSnd').addEventListener('click',function(e){e.stopPropagation();toggleSound();sfx.click()});
  $('spin').classList.add('gone');
  screenStart();animate();
  armAudio()}
function waitThree(n){
  if(window.THREE)return boot();
  if(n<=0)return window.__fail();
  setTimeout(function(){waitThree(n-1)},120)}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',function(){waitThree(60)});
else waitThree(60);
})();
</script>
